# Derived from cilium/tetragon (Apache-2.0) examples:
#   examples/tracingpolicy/sys_setuid.yaml  (syscall kprobe shape)
#   examples/tracingpolicy/modules-nohost.yaml (matchNamespaces host-ns scoping)
# Scope: kill setuid-to-root attempts from processes that are NOT in the
# host PID namespace (i.e. sandbox/agent processes). Host-namespace admin
# tools (su, sudo) are untouched.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "sandbox-privilege-escalation"
  annotations:
    description: "Sigkill setuid(0) attempts from processes outside the host PID namespace"
spec:
  kprobes:
  - call: "sys_setuid"
    syscall: true
    args:
    - index: 0
      type: "int"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "0" # setuid(0): attempt to become root
      matchNamespaces:
      - namespace: Pid
        operator: "NotIn"
        values:
        - "host_ns"
      matchActions:
      - action: Sigkill
